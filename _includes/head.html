{% if page.excerpt %}
<meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}">
{% elsif page.description %}
<meta name="description" content="{{ page.description | escape }}">
{% else %}
<meta name="description" content="{{ site.description | escape }}">
{% endif %}

{% if page.keywords %}
<meta name="keywords" content="{{ page.keywords | escape }}">
{% elsif page.tags %}
<meta name="keywords" content="{{ page.tags | join: ', ' | escape }}">
{% endif %}

<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="{{ page.og_type | default: 'website' }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:locale" content="zh_CN">
{% if page.image %}
<meta property="og:image" content="{{ page.image | absolute_url }}">
{% else %}
<meta property="og:image" content="{{ site.logo | absolute_url }}">
{% endif %}

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
{% if page.image %}
<meta name="twitter:image" content="{{ page.image | absolute_url }}">
{% endif %}

<meta name="theme-color" content="#4f46e5">
<meta name="msapplication-TileColor" content="#0f172a">

<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="manifest" href="{{ '/manifest.json' | relative_url }}">

<link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }} RSS" href="{{ '/feed.xml' | relative_url }}">
<!-- 弹窗样式与脚本开始 -->
<style>
#popupOverlay {
display: none;
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.5);
backdrop-filter: blur(4px);
-webkit-backdrop-filter: blur(4px);
align-items: center;
justify-content: center;
z-index: 9999;
padding: 10px;
box-sizing: border-box;
}
#popupOverlay.show {
display: flex;
}
.popup-content {
background: #fff;
padding: 20px 30px;
border-radius: 12px;
max-width: 100%;
width: 370px;
text-align: center;
position: relative;
box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
box-sizing: border-box;
max-height: 90vh;
overflow-y: auto;
}
.popup-close-btn {
position: absolute;
top: 5px;
right: 5px;
width: 32px;
height: 32px;
border-radius: 50%;
background: rgba(0, 0, 0, 0.05);
border: none;
font-size: 20px;
font-weight: bold;
color: #999;
cursor: pointer;
transition: all 0.3s;
flex-shrink: 0;
touch-action: manipulation;
display: flex;
align-items: center;
justify-content: center;
line-height: 1;
z-index: 10;
}
.popup-close-btn:hover {
background: #f44336;
color: #fff;
}
.popup-link {
text-decoration: none;
color: inherit;
display: block;
}
.popup-title {
margin: 0 0 10px;
font-size: 24px;
font-weight: bold;
color: #ff4d4f;
word-wrap: break-word;
}
.popup-image {
width: 100%;
max-width: 300px;
height: auto;
display: block;
margin: 0 auto 15px;
border-radius: 8px;
}
.popup-shop-btn {
display: inline-block;
width: 100%;
background: #e11d48;
color: #fff;
font-weight: bold;
padding: 12px 1px;
border-radius: 8px;
text-decoration: none;
transition: background 0.3s;
box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
.popup-shop-btn:hover {
background: #be123c;
}
@media (max-width: 768px) {
.popup-content {
width: 95%;
max-width: 320px;
padding: 15px 20px;
}
.popup-title {
font-size: 20px;
}
.popup-close-btn {
width: 28px;
height: 28px;
font-size: 18px;
}
}
</style>
<!-- 弹窗 HTML 结构 -->
<div id="popupOverlay">
<div class="popup-content">
<div style="display: flex; flex-direction: column; gap: 1rem;">
<a href="https://ml.yfqz1.net/register?code=PCC6A3bC" target="_blank" class="popup-link">
<p class="popup-title">Clash 机场推荐</p>
<img src="https://xiaohuojianzhanghao.github.io/img/6a229370bf0c1.png" alt="机场地址" class="popup-image">
</a>
<div style="border-top: 1px solid #f3f4f6; padding-top: 1rem;">
<a href="http://shop.xinkonyun.cc/" target="_blank" class="popup-shop-btn">
购买 Shadowrocket 独享账号/海外其他账号
</a>
</div>
</div>
<button class="popup-close-btn" id="popupCloseBtn" aria-label="关闭">&times;</button>
</div>
</div>
<!-- 弹窗控制脚本 -->
<script>
(function() {
const popupOverlay = document.getElementById('popupOverlay');
const popupCloseBtn = document.getElementById('popupCloseBtn');
window.addEventListener('DOMContentLoaded', function() {
setTimeout(() => {
popupOverlay.classList.add('show');
}, 500);
});
popupCloseBtn.addEventListener('click', function(e) {
e.stopPropagation();
popupOverlay.classList.remove('show');
});
// 点击遮罩层关闭弹窗
popupOverlay.addEventListener('click', function(e) {
if (e.target === popupOverlay) {
popupOverlay.classList.remove('show');
}
});
})();
</script>
