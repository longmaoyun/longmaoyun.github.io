{% if page.excerpt %}
<meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}">
{% elsif page.description %}
<meta name="description" content="{{ page.description | escape }}">
{% else %}
<meta name="description" content="{{ site.description | escape }}">
{% endif %}

{% if page.keywords %}
<meta name="keywords" content="{{ page.keywords | escape }}">
{% elsif page.tags %}
<meta name="keywords" content="{{ page.tags | join: ', ' | escape }}">
{% endif %}

<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="{{ page.og_type | default: 'website' }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:locale" content="zh_CN">
{% if page.image %}
<meta property="og:image" content="{{ page.image | absolute_url }}">
{% else %}
<meta property="og:image" content="{{ site.logo | absolute_url }}">
{% endif %}

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
{% if page.image %}
<meta name="twitter:image" content="{{ page.image | absolute_url }}">
{% endif %}

<meta name="theme-color" content="#4f46e5">
<meta name="msapplication-TileColor" content="#0f172a">

<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="manifest" href="{{ '/manifest.json' | relative_url }}">

<link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }} RSS" href="{{ '/feed.xml' | relative_url }}">
 <!-- ==================== 弹窗开始 ==================== -->

<style>
#popupOverlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    align-items: center;
    justify-content: center;
    z-index: 999999;
    padding: 15px;
    box-sizing: border-box;
}

#popupOverlay.show {
    display: flex;
}

.popup-content {
    width: 380px;
    max-width: 100%;
    background: #ffffff;
    border-radius: 18px;
    padding: 25px 20px 20px;
    position: relative;
    text-align: center;
    box-sizing: border-box;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    animation: popupShow 0.35s ease;
    max-height: 90vh;
    overflow-y: auto;
}

@keyframes popupShow {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.popup-close-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: #f3f4f6;
    color: #888;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    z-index: 10;
    transition: all 0.25s ease;
}

.popup-close-btn:hover {
    background: #ef4444;
    color: #fff;
}

.popup-link {
    display: block;
    text-decoration: none;
    color: inherit;
}

.popup-title {
    margin: 0 0 10px;
    font-size: 24px;
    line-height: 1.4;
    font-weight: 800;
    color: #ef4444;
}

.popup-desc {
    margin: 0 0 15px;
    font-size: 14px;
    line-height: 1.6;
    color: #666;
}

.popup-image {
    width: 100%;
    max-width: 320px;
    height: auto;
    display: block;
    margin: 0 auto 18px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
}

.popup-shop-box {
    border-top: 1px solid #eeeeee;
    padding-top: 18px;
    margin-top: 5px;
}

.popup-shop-btn {
    display: block;
    width: 100%;
    box-sizing: border-box;
    background: linear-gradient(135deg, #ff416c, #e11d48);
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.5;
    padding: 14px 10px;
    border-radius: 10px;
    text-decoration: none;
    box-shadow: 0 6px 15px rgba(225, 29, 72, 0.3);
    transition: all 0.25s ease;
}

.popup-shop-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(225, 29, 72, 0.4);
}

@media (max-width: 480px) {

    #popupOverlay {
        padding: 12px;
    }

    .popup-content {
        width: 95%;
        padding: 22px 15px 18px;
        border-radius: 16px;
    }

    .popup-title {
        font-size: 21px;
    }

    .popup-desc {
        font-size: 13px;
    }

    .popup-shop-btn {
        font-size: 15px;
        padding: 13px 8px;
    }

    .popup-close-btn {
        width: 30px;
        height: 30px;
        font-size: 20px;
    }
}
</style>
